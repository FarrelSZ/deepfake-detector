[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = [".", "streamlit_ui"]
testpaths = ["tests"]
filterwarnings = [
    # Peringatan dari library pihak ketiga yang tidak bisa kita perbaiki di sini
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]
